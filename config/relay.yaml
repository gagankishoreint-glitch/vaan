# The Relay -- every number lives here, nothing hard-coded.
#
# Contract for this file:
#   * a value of `null` means NOT YET MEASURED. Code that reads it must use
#     Config.require(), which raises. We never invent a number (rule 4).
#   * every null line carries a `# set by ...` note naming the phase and the
#     measurement that fills it. tests/test_config.py enforces this.
#   * UNVERIFIED means "from memory / docs table, not yet observed". The P1
#     probe replaces it with observed values.

meta:
  yaml_version: 1

# Limits copied from the Groq docs table. UNVERIFIED until the P1 probe.
# P1 overwrites these with values observed from x-ratelimit-* headers.
models:
  small:  {id: "openai/gpt-oss-20b",  rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
  large:  {id: "openai/gpt-oss-120b", rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
  # Sent ONLY to gpt-oss models, and never "none". "low" is the cheapest setting
  # that stays inside the reasoning family; the probe records the verbatim 400 if
  # the service rejects the parameter, so this is the fallback until then.
  reasoning_effort: "low"
  buckets_separate_per_model: null    # set by P1 probe: exhaust one model, watch the other's headers

user:
  patience_s: null                    # set by L5 measurement: observed time-to-abandon in the harness

slo:
  ttft_p50_s: null                    # set by P4/P9 baseline run: p50 of attempt t_first_token - t_sent
  ttft_p95_s: null                    # set by P4/P9 baseline run: p95 of the same
  total_p95_s: null                   # set by P9: p95 of request total_elapsed_s

pipeline:
  max_loops: 1
  # Stream the draft so model_ttft (first CONTENT delta) is observable. The
  # pipeline still buffers and verifies before sending, so this does not reduce
  # user-visible latency yet -- it makes the timing measurable.
  stream: false
  max_redrafts: 1
  top_k: 4
  max_tokens: {rewrite: 80, draft: 400, verify: 120}
  # Gate on the optional LLM verify step (PRD s4). Code checks always run.
  llm_verify:
    min_tpm_remaining_frac: null      # set by P6: budget fraction below which LLM verify is skipped
    min_tpd_remaining_frac: null      # set by P6: same rule, daily bucket

gateway:
  retry_policy: managed               # managed | naive (naive exists only to show harm on the stand-in)
  retry_budget_ratio: 0.1             # fraction of traffic allowed to retry at all
  # Hard cap on HTTP attempts per logical call. Distinct from the ratio: the ratio
  # is "how much of traffic may retry at all", this is "how far one call may go".
  max_attempts: 3
  # Naive policy only (stand-in only, exists to demonstrate harm). Bounded so it
  # cannot recurse; fixed backoff because the point is that it ignores retry-after.
  naive_max_attempts: 5
  naive_backoff_s: 0.2
  # Credit granted at start-up so a cold gateway can retry its first failures.
  # 1.0 = allow one retry before any traffic has accrued.
  retry_credit_floor: 1.0
  # PER-ATTEMPT cap, distinct from request_deadline_s (the whole request) and from
  # the retry policy. One attempt that exceeds this is abandoned and RETRIED; the
  # outer deadline still bounds the total. UNMEASURED: needs p99 of the real fast
  # path from the P1 probe. null = no per-attempt cap (the outer deadline only),
  # because inventing a number here would silently cut healthy requests.
  attempt_timeout_s: null             # set by P1 probe: p99 of fast path, plus margin
  queue_max: null                     # set by P1: depth at which admission starts queueing/shedding
  breaker: {fail_threshold: 5, open_s: 10}
  retry_jitter_frac: 0.0              # set by P9: raised if the harness shows retry synchronisation
  # A 429 is treated as a DAY limit if retry-after is at least this. Deliberately
  # null: the probe classifies from remaining_rpd and the body text first, and
  # records why. Set only once the real day-limit retry-after is observed (Q-09).
  day_429_min_retry_after_s: null     # set by P1 Q-09: observed day-limit retry-after
  request_deadline_s: null            # set by L5: user patience minus reply-render margin
  # Provisional during P6 (stand-in only); replaced by the L5 patience measurement.
  request_deadline_standin_s: 30.0

ladder:
  # PRD s6. L0 and L3 are structural; L1 and L2 need measured thresholds.
  l1_tpm_remaining_frac: 0.25         # trigger: TPM remaining below this fraction
  l1_queue_wait_s: 2.0                # trigger: admission queue wait exceeds this
  l2_dup_window_s: null               # set by P7: duplicate-arrival window measured from the event log
  l2_max_tokens_scale: null           # set by P7: answer-cap multiplier chosen at L2

retrieval:
  chunk_size: null                    # set by P2 ingest, re-tuned in P10 (>= 3 settings compared)
  chunk_overlap: null                 # set by P2: chosen against measured retrieval recall
  bm25_k1: 1.5                        # library default; re-tuned only if P10 shows it matters
  bm25_b: 0.75
  # Evidence gate: top-1 BM25 score at or above this means "strong evidence".
  # MEASURED in P3 at chunk_size 900 via scripts/retrieval_eval.py (25th pct of
  # answerable top-1 scores). Re-measure if the corpus changes.
  gate_threshold: 15.86

standin:
  seed: 7
  # Calibration targets for P4, all sourced from the P1 probe.
  ttft_ms: null                       # set by P1 probe: TTFT distribution to replay
  tokens_per_s: null                  # set by P1 probe: observed generation rate
  error_rate: null                    # set by P1 probe: observed 5xx rate (0 if none seen)
  p429_rate: null                     # set by P1 probe: observed 429 rate under our traffic
  per_minute_limit: 8000              # OBSERVED (transcribed, n=4); raw JSONL pending
  per_day_limit: null                 # set by P1 probe: observed x-ratelimit-limit-requests
  # Whether the provider gives back unused completion cap when the call finishes.
  # OPEN (Q-06). false = what the four transcribed observations show: the deficit
  # carried the FULL cap even when only 41 of 80 tokens were generated. Flip it to
  # run the A/B that settles the question. UNMEASURED as a switch.
  refund_unused_cap: false

observability:
  latency_sum_tolerance_s: 0.05       # tolerance for waiting + working + retrying ~= total
